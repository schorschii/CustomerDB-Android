apply plugin: 'com.android.application'

android {
    defaultConfig {
        applicationId "de.georgsieber.customerdb"
        minSdk 21
        targetSdk 37
        compileSdk 36
        versionCode 100
        versionName "3.12.0"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            applicationVariants.all { variant ->
                variant.outputs.all { output ->
                    output.outputFileName = 'customerdb.apk'
                }
            }
        }
    }
    flavorDimensions "appstore"
    productFlavors {
        standalone {
            dimension "appstore"
            dependenciesInfo {
                // Disables dependency metadata when building APKs.
                includeInApk = false
                // Disables dependency metadata when building Android App Bundles.
                includeInBundle = false
            }
        }
        google {
            dimension "appstore"
            minSdkVersion 21 // for Play billing library >= 7.0.0
        }
    }
    namespace 'de.georgsieber.customerdb'
}

dependencies {
    //implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.opencsv:opencsv:4.6'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    implementation 'me.dm7.barcodescanner:zxing:1.9.8'
    googleImplementation 'com.android.billingclient:billing:8.0.0'
}
